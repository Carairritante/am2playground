name: AM2PG CI
on:
  push:
  pull_request:
    branches: [correcoes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: am2pg-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile tooling and integration probes
        run: python maintenance/ci.py
      - name: Build and verify playable mod
        run: |
          python maintenance/build_playable.py
          printf '### Playable mod\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat maintenance/build/playable-dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload playable JAR without ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: maintenance/build/playable-dist/AM2PlayGround-*.jar
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload checksum without ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: maintenance/build/playable-dist/SHA256SUMS
          archive: false
          if-no-files-found: error
          retention-days: 14
